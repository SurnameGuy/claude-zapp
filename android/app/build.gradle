plugins { id 'com.android.application' }

android {
    namespace 'app.zapp'
    compileSdk 34

    defaultConfig {
        applicationId 'app.zapp.messenger'
        minSdk 28
        targetSdk 34
        versionCode 1
        versionName '1.0'
        ndk { abiFilters 'arm64-v8a' }            // celulares modernos. Para emulador x86_64 veja o README
        externalNativeBuild { cmake { cppFlags '-std=c++17'; arguments '-DANDROID_STL=c++_shared' } }
    }

    signingConfigs {
        release {
            // chave fixa do projeto: assim as atualizações instalam por cima sem perder a sessão
            storeFile file('zapp.p12')
            storePassword 'zappzapp'
            keyAlias 'zapp'
            keyPassword 'zappzapp'
            storeType 'pkcs12'
        }
    }
    buildTypes {
        release { signingConfig signingConfigs.release; minifyEnabled false }
        debug { signingConfig signingConfigs.release }
    }
    externalNativeBuild { cmake { path 'src/main/cpp/CMakeLists.txt' } }
    sourceSets { main { jniLibs.srcDirs = ['libnode/bin'] } }   // libnode/bin/<abi>/libnode.so (baixado por scripts/fetch-libnode.sh)
    packagingOptions { jniLibs { useLegacyPackaging = true } }   // comprime os .so: APK ~25 MB em vez de ~70 MB
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    lint { abortOnError false; checkReleaseBuilds false }
}
